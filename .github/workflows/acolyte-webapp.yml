name: Acolyte webapp

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Syntax checks
        run: |
          node --check webapp/app.js
          node --check webapp/content/slides.js
          node --check webapp/journeys/operating-system/config.js
          node --check webapp/journeys/pme-overview/content.js
          node --check webapp/journeys/pme-overview/opportunities.js
          node --check webapp/journeys/pme-overview/solutions.js
      - name: Webapp checks
        run: |
          bash webapp/tests/smoke.sh
          python3 webapp/tests/e2e.py
          git diff --check
